# Baut eine installierbare Test-APK (Release-Build, mit Debug-Schlüssel signiert).
# Die APK liegt danach unter „Artifacts“ im jeweiligen Actions-Lauf.
name: Android-APK

on:
  push:
    branches: [main, 'claude/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'
          channel: stable
          cache: true

      - name: Abhängigkeiten
        run: flutter pub get

      - name: Analyse
        run: flutter analyze

      - name: Tests
        run: flutter test

      - name: APK bauen
        run: flutter build apk --release

      - name: APK umbenennen
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | awk '{print $2}' | tr '+' '-')
          mv build/app/outputs/flutter-apk/app-release.apk "build/app/outputs/flutter-apk/vibono-${VERSION}-${GITHUB_SHA::7}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: vibono-apk
          path: build/app/outputs/flutter-apk/vibono-*.apk
          if-no-files-found: error
          retention-days: 30
