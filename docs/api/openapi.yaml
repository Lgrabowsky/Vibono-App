          items:
            type: object
            properties:
              name:
                type: string
              amount_g:
                type: number
                nullable: true
              kcal_per_100g:
                type: number
                nullable: true
              confidence:
                type: number
                minimum: 0
                maximum: 1
              raw_text:
                type: string
        total_g:
