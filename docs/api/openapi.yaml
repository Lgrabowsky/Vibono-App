openapi: 3.0.3
info:
  title: Vibono App API
  version: 1.0.0
  description: |
    Schnittstelle zwischen der App "Vibono" (Flutter, iOS/Android) und vibono.de (WordPress + WooCommerce).
    Bereitgestellt vom WordPress-Plugin `vibono-app-api` unter `/wp-json/vibono/v1`.

    Konventionen
    - Alle Zeitstempel sind ISO 8601 in UTC (`2026-11-14T13:05:00Z`). Kalendertage (`date`) sind `YYYY-MM-DD` in Europe/Berlin.
    - Tage im Coaching haben **keine Uhrzeiten**. Inhalte werden pro Tag geliefert, nicht pro Uhrzeit.
    - Authentifizierung: `Authorization: Bearer <access_token>` (JWT HS256, 60 Minuten gültig). Mit dem Refresh-Token (90 Tage, rotiert bei jeder Nutzung) holt die App ein neues Paar.
    - Fehler im WordPress-Standardformat: `{ "code": "vibono_…", "message": "…", "data": { "status": 4xx } }`.
    - Geldbeträge in Cent (Integer). Punkte sind Integer.
    - Es gibt keine In-App-Käufe. Die App zeigt keine Preise und keine Kauf-Buttons für digitale Inhalte; ob Shop-Links erscheinen, steuert `GET /config`.

    Mit ANNAHME markierte Stellen hängen von Theme-/Plugin-Code ab, der noch nicht vorliegt.
servers:
- url: https://www.vibono.de/wp-json/vibono/v1
- url: https://staging.vibono.de/wp-json/vibono/v1
  description: ANNAHME, Staging-Domain noch unbekannt
security:
- bearerAuth: []
tags:
- name: Auth
- name: Profil
- name: Synchronisation
- name: Inhalte
- name: Punkte
- name: Lesen
- name: Prämien
- name: Empfehlungen
- name: System
- name: Energiedichte
paths:
  /config:
    get:
      tags:
      - System
      summary: Öffentliche App-Konfiguration und Feature-Flags
      security: []
      parameters:
      - in: query
        name: platform
        schema:
          type: string
          enum:
          - ios
          - android
          - web
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppConfig'
  /auth/login:
    post:
      tags:
      - Auth
      summary: Login mit Vibono-Account (E-Mail oder Benutzername + Passwort)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - username
              - password
              properties:
                username:
                  type: string
                  description: E-Mail oder Benutzername
                password:
                  type: string
                  format: password
                device_name:
                  type: string
                  example: iPhone von Anna
      responses:
        '200':
          description: Eingeloggt
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '401':
          description: vibono_invalid_credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: vibono_too_many_attempts (5 Fehlversuche / 15 min je IP+Konto)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /auth/register:
    post:
      tags:
      - Auth
      summary: Neues Vibono-Konto anlegen (legt einen WordPress-/WooCommerce-Kunden an)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - email
              - password
              - accept_privacy
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  format: password
                  minLength: 8
                first_name:
                  type: string
                referral_code:
                  type: string
                  description: Code der werbenden Person, falls vorhanden. Wird ignoriert, solange features.referral = false.
                accept_privacy:
                  type: boolean
                  description: Einwilligung Datenschutz inkl. Gesundheitsdaten (Art. 9 DSGVO)
                device_name:
                  type: string
      responses:
        '201':
          description: Konto angelegt und eingeloggt
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '400':
          description: vibono_invalid_email | vibono_weak_password | vibono_privacy_required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: vibono_email_exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /auth/refresh:
    post:
      tags:
      - Auth
      summary: Neues Token-Paar mit dem Refresh-Token holen (Refresh-Token wird dabei ersetzt)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - refresh_token
              properties:
                refresh_token:
                  type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '401':
          description: vibono_invalid_refresh_token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /auth/logout:
    post:
      tags:
      - Auth
      summary: Refresh-Token widerrufen
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                refresh_token:
                  type: string
                all_devices:
                  type: boolean
                  default: false
      responses:
        '200':
          description: OK
  /auth/password-reset:
    post:
      tags:
      - Auth
      summary: Passwort-Zurücksetzen-Mail von WordPress auslösen
      security: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - email
              properties:
                email:
                  type: string
                  format: email
      responses:
        '200':
          description: Immer 200, um keine Konten preiszugeben
  /auth/web-session:
    post:
      tags:
      - Auth
      summary: Einmal-Link, um eingeloggt im Browser auf vibono.de zu landen (z. B. Shop, Punkte einlösen)
      description: |
        Liefert eine URL mit Einmal-Token (2 Minuten gültig, einmal nutzbar). Die App öffnet sie im externen Browser.
        `redirect` muss ein Pfad auf vibono.de sein. Nur nutzen, wenn `GET /config` den Link für die Plattform erlaubt.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                redirect:
                  type: string
                  example: /shop/
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  url:
                    type: string
                    format: uri
                  expires_at:
                    type: string
                    format: date-time
  /me:
    get:
      tags:
      - Profil
      summary: Eigenes Profil, Mitgliedschaft, Onboarding, Ziele, Punktestand
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
    delete:
      tags:
      - Profil
      summary: App-Daten löschen (Apple-Pflicht "Konto löschen in der App")
      description: Stößt die Konto-Löschung an. Das Vibono-Team bestätigt per E-Mail (Bestellungen müssen gesetzlich aufbewahrt
        werden).
      responses:
        '202':
          description: Löschung beantragt
  /me/profile:
    put:
      tags:
      - Profil
      summary: Onboarding-Angaben und Wunschgewichte speichern (Teil-Update, nur gesendete Felder ändern sich)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfileUpdate'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
        '400':
          description: vibono_invalid_profile (data.fields nennt fehlerhafte Felder)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /me/devices:
    post:
      tags:
      - Profil
      summary: Push-Token registrieren oder aktualisieren
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - token
              - platform
              properties:
                token:
                  type: string
                platform:
                  type: string
                  enum:
                  - ios
                  - android
                app_version:
                  type: string
                locale:
                  type: string
                  example: de-DE
      responses:
        '200':
          description: OK
    delete:
      tags:
      - Profil
      summary: Push-Token entfernen
      parameters:
      - in: query
        name: token
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
  /sync:
    get:
      tags:
      - Synchronisation
      summary: Änderungen aller Sammlungen seit dem Cursor holen
      description: |
        Ohne `cursor` kommt ein vollständiger Stand. Danach immer den zurückgegebenen `cursor` speichern.
        Änderungen, die auf der Website (MyVibono) gemacht wurden, erscheinen hier ebenfalls.
        Bei `has_more: true` sofort erneut mit dem neuen Cursor abfragen.
      parameters:
      - in: query
        name: cursor
        schema:
          type: string
      - in: query
        name: collections
        description: Kommagetrennte Liste, Standard alle
        schema:
          type: string
          example: favorites,weight
      - in: query
        name: limit
        schema:
          type: integer
          default: 500
          maximum: 1000
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncPullResponse'
        '410':
          description: 'vibono_cursor_expired: Cursor zu alt, ohne Cursor neu laden'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      tags:
      - Synchronisation
      summary: Lokale Änderungen hochladen (max. 500 pro Aufruf)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - changes
              properties:
                changes:
                  type: array
                  items:
                    $ref: '#/components/schemas/ClientChange'
      responses:
        '200':
          description: Ergebnis je Änderung
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncPushResponse'
  /me/{collection}:
    parameters:
    - in: path
      name: collection
      required: true
      schema:
        type: string
        enum:
        - favorites
        - lessons-done
        - courses-done
        - weight
        - sport
        - weekplan
    get:
      tags:
      - Synchronisation
      summary: Aktuellen Stand einer Sammlung holen (Komfort-Endpunkt, gleiche Daten wie /sync)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/SyncItem'
                  cursor:
                    type: string
    put:
      tags:
      - Synchronisation
      summary: Änderungen an einer Sammlung schreiben (Komfort-Endpunkt für /sync POST)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - changes
              properties:
                changes:
                  type: array
                  items:
                    $ref: '#/components/schemas/CollectionChange'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncPushResponse'
  /coaching/today:
    get:
      tags:
      - Inhalte
      summary: Tagesübersicht für den Startbildschirm
      parameters:
      - in: query
        name: date
        description: Kalendertag, Standard heute (Europe/Berlin). Mit ‹ › blättert die App über dieses Feld.
        schema:
          type: string
          format: date
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CoachingDay'
  /content/{type}:
    parameters:
    - in: path
      name: type
      required: true
      schema:
        type: string
        enum:
        - lessons
        - recipes
        - tips
        - tips-of-the-day
    get:
      tags:
      - Inhalte
      summary: Inhaltsliste, optional nur Änderungen seit `since`
      parameters:
      - in: query
        name: since
        schema:
          type: string
          format: date-time
      - in: query
        name: search
        schema:
          type: string
      - in: query
        name: tags
        description: Kommagetrennt, z. B. vegetarisch,ut-geeignet (ANNAHME, Rezept-Merkmale noch zu klären)
        schema:
          type: string
      - in: query
        name: course
        description: Nur lessons, Kurs-ID (Taxonomie-Begriff)
        schema:
          type: integer
      - in: query
        name: page
        schema:
          type: integer
          default: 1
      - in: query
        name: per_page
        schema:
          type: integer
          default: 20
          maximum: 100
      responses:
        '200':
          description: OK. Header X-WP-Total und X-WP-TotalPages wie bei WordPress.
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/ContentSummary'
                  deleted_ids:
                    type: array
                    description: Nur mit since, seitdem entfernte oder depublizierte IDs
                    items:
                      type: integer
                  server_time:
                    type: string
                    format: date-time
  /content/item/{id}:
    get:
      tags:
      - Inhalte
      summary: Einzelner Beitrag mit Volltext (Paywall geprüft)
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContentDetail'
        '403':
          description: |
            vibono_membership_required (data.required_plans) oder vibono_reward_required: exklusiver Beitrag,
            noch nicht freigeschaltet (data.reward_id, data.cost_points). Die App bietet dann das Einlösen an
            (POST /rewards/{reward_id}/redeem).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          $ref: '#/components/responses/Error'
  /points:
    get:
      tags:
      - Punkte
      summary: Punktestand, Gegenwert und laufende Aktionen
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PointsSummary'
  /points/ledger:
    get:
      tags:
      - Punkte
      summary: Punkte-Verlauf, neueste zuerst
      parameters:
      - in: query
        name: page
        schema:
          type: integer
          default: 1
      - in: query
        name: per_page
        schema:
          type: integer
          default: 30
          maximum: 100
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/LedgerEntry'
                  total:
                    type: integer
  /points/app-open:
    post:
      tags:
      - Punkte
      summary: Tägliche App-Öffnung melden (einmal je Kalendertag Europe/Berlin, idempotent)
      description: |
        Zählt die Serie (Streak) weiter und vergibt die Punkte der erreichten Stufe. Die Antwort enthält
        den neuen Stand der Serie unter streak (inkl. event).
      responses:
        '200':
          description: OK. Bei bereits gemeldetem Tag awarded_points = 0 und already_awarded = true.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AwardResult'
  /points/campaigns:
    get:
      tags:
      - Punkte
      summary: Laufende und angekündigte Aktionen
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Campaign'
  /rewards:
    get:
      tags:
      - Prämien
      summary: Punktestand, Prämien-Katalog und eigene Prämien
      description: |
        Liefert nur Prämienarten, die auf der Plattform eingelöst werden dürfen (features.reward_kinds aus
        GET /config). Standard: exklusive Inhalte und eBooks/PDFs in der App, Rabatt auf die Verlängerung nur
        auf der Website (platform=web). 403 vibono_feature_disabled, wenn das Modul „Prämien“ aus ist.
      parameters:
      - in: query
        name: platform
        schema:
          type: string
          enum:
          - ios
          - android
          - web
          default: ios
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RewardCatalog'
        '403':
          $ref: '#/components/responses/Error'
  /rewards/{id}/redeem:
    post:
      tags:
      - Prämien
      summary: Prämie gegen Punkte einlösen
      description: |
        Bucht die Punkte ab (Grund reward) und schaltet frei. Exklusive Inhalte und Dateien gelten danach
        dauerhaft, der Rabatt erzeugt einen persönlichen Einmal-Gutschein (coupon). Höchstens 10 Versuche
        pro Minute.
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                platform:
                  type: string
                  enum:
                  - ios
                  - android
                  - web
                  default: ios
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RewardRedeemResult'
        '403':
          description: vibono_not_available_here (Prämienart auf dieser Plattform aus) oder vibono_feature_disabled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: vibono_disabled / vibono_reward_not_found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: vibono_insufficient_points, vibono_already_unlocked oder vibono_limit_reached (data.reward_id)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: vibono_busy (gleichzeitige Einlösung) oder vibono_rate_limited
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /rewards/{id}/download:
    get:
      tags:
      - Prämien
      summary: Kurzlebiger Download-Link für ein freigeschaltetes eBook/PDF
      description: Die App öffnet url im externen Browser. Der Link gilt 15 Minuten (einstellbar).
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  url:
                    type: string
                    format: uri
                  expires_at:
                    type: string
                    format: date-time
        '403':
          description: vibono_reward_locked (noch nicht freigeschaltet)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          $ref: '#/components/responses/Error'
  /rewards/file:
    get:
      tags:
      - Prämien
      summary: Datei ausliefern (signierter Link aus /rewards/{id}/download)
      security: []
      parameters:
      - in: query
        name: t
        required: true
        schema:
          type: string
        description: Signiertes Token (HMAC), enthält Konto, Prämie und Ablaufzeit
      responses:
        '200':
          description: Die Datei (z. B. application/pdf) als Download
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '403':
          description: vibono_link_expired (Token falsch oder abgelaufen) oder vibono_reward_locked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /reading/start:
    post:
      tags:
      - Lesen
      summary: Lese-Session für einen Artikel starten
      description: |
        Punkte gibt es nur, wenn der Artikel nachweislich gelesen wurde. Die Prüfung läuft serverseitig:
        Mindest-Aktivzeit abhängig von der Wortzahl, Scrolltiefe, plausible Heartbeats (Wanduhrzeit),
        optional eine Quizfrage. Siehe docs/PUNKTESYSTEM.md.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - post_id
              properties:
                post_id:
                  type: integer
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadingSession'
        '409':
          description: 'vibono_already_rewarded: Für diesen Artikel gab es schon Punkte (Lesen ist trotzdem möglich, nur ohne
            Punkte)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /reading/heartbeat:
    post:
      tags:
      - Lesen
      summary: Lesefortschritt melden, alle 10-15 Sekunden, nur wenn der Artikel sichtbar ist und die App im Vordergrund
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - session_id
              - active_seconds
              - scroll_depth
              properties:
                session_id:
                  type: string
                active_seconds:
                  type: integer
                  description: Summe der aktiven Lesezeit seit Start (nicht nur seit letztem Heartbeat)
                scroll_depth:
                  type: number
                  minimum: 0
                  maximum: 1
                  description: Größte erreichte Scrollposition, 1 = Ende des Artikels
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadingProgress'
        '404':
          description: vibono_reading_session_not_found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /reading/complete:
    post:
      tags:
      - Lesen
      summary: Lesen abschließen und Punkte beantragen
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - session_id
              properties:
                session_id:
                  type: string
                quiz_answer:
                  type: integer
                  description: Index der gewählten Antwort, falls ReadingSession.quiz gesetzt
      responses:
        '200':
          description: Punkte gutgeschrieben
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AwardResult'
        '422':
          description: |
            vibono_reading_incomplete (data.progress zeigt was fehlt) |
            vibono_quiz_wrong (ein zweiter Versuch ist nach 30 s erlaubt) |
            vibono_daily_cap_reached
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /referral:
    get:
      tags:
      - Empfehlungen
      summary: Eigener Empfehlungscode, Teilen-Link und Zähler
      description: Nur wenn GET /config features.referral = true, sonst 403 vibono_feature_disabled.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReferralInfo'
        '403':
          description: vibono_feature_disabled (Modul Freunde werben ist aus)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /referral/validate:
    get:
      tags:
      - Empfehlungen
      summary: Prüfen, ob ein Code gültig ist (Registrierung)
      security: []
      parameters:
      - in: query
        name: code
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  valid:
                    type: boolean
                  referrer_first_name:
                    type: string
                    nullable: true
                  friend_bonus_points:
                    type: integer
        '403':
          description: vibono_feature_disabled (Modul Freunde werben ist aus)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /foods:
    get:
      tags:
      - Energiedichte
      summary: Lebensmittel für die manuelle Eingabe im Energiedichte-Rechner suchen
      parameters:
      - in: query
        name: q
        required: true
        schema:
          type: string
          minLength: 2
      - in: query
        name: limit
        schema:
          type: integer
          default: 20
          maximum: 50
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Food'
  /energy-density/scan-recipe:
    post:
      tags:
      - Energiedichte
      summary: Foto eines Rezepts (Zutatenliste) auswerten
      description: Serverseitig per Vision-Modell (Claude API, Schlüssel nur auf dem Server). Ratenlimit je Nutzer (Standard
        20 pro Tag).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ImageUpload'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecipeScanResult'
        '413':
          description: vibono_image_too_large (max. 5 MB nach Base64-Dekodierung)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: vibono_rate_limited
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: vibono_vision_unavailable (kein API-Schlüssel hinterlegt oder Dienst nicht erreichbar)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /energy-density/analyze-photo:
    post:
      tags:
      - Energiedichte
      summary: Foto eines Gerichts grob schätzen (Portion, kcal, Energiedichte)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
              - $ref: '#/components/schemas/ImageUpload'
              - type: object
                properties:
                  description:
                    type: string
                    description: Optionaler Hinweis, z. B. "mit Vollkornnudeln"
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PhotoAnalysisResult'
        '413':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    Error:
      description: Fehler
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    Error:
      type: object
      properties:
        code:
          type: string
          example: vibono_invalid_credentials
        message:
          type: string
          example: E-Mail oder Passwort ist falsch.
        data:
          type: object
          properties:
            status:
              type: integer
          additionalProperties: true
    AppConfig:
      type: object
      properties:
        api_version:
          type: string
          example: 1.0.0
        min_app_version:
          type: string
          example: 1.0.0
        shop_links:
          type: object
          description: |
            Ob die App auf den Shop verlinken darf. Physische Produkte: erlaubt. Digitale Inhalte (Mitgliedschaften):
            standardmäßig aus, siehe docs/APP-STORE.md.
          properties:
            physical_products:
              type: boolean
            memberships:
              type: boolean
            points_redemption:
              type: boolean
              description: |
                Punkte als Guthaben an der Kasse einlösen und Euro-Gegenwert anzeigen. Nur true, wenn
                „Guthaben an der Kasse“ im Backend an ist (seit 21.11.2026 standardmäßig aus).
        shop_url:
          type: string
          format: uri
          nullable: true
        points_enabled:
          type: boolean
        cents_per_point:
          type: number
          example: 1
        features:
          type: object
          description: |
            Welche Module auf vibono.de eingeschaltet sind. Die App blendet ausgeschaltete Funktionen aus.
            Die Module werden schrittweise eingeführt (siehe docs/ANBINDUNG.md), anfangs sind alle false.
          properties:
            referral:
              type: boolean
              description: Freunde werben (GET /referral, Empfehlungscode bei der Registrierung)
            shop_points:
              type: boolean
              description: Modul „Punkte im Shop“ an (Reiter „Vibono-Punkte“ in Mein Konto)
            purchase_points:
              type: boolean
              description: Punkte für Einkäufe. Seit 21.11.2026 standardmäßig aus (abschaltbar, nicht entfernt)
            coaching_points:
              type: boolean
              description: Punkte für erledigte Lektionen und abgeschlossene Kurse
            rewards:
              type: boolean
              description: Prämien (GET /rewards) und exklusive Beiträge
            reward_kinds:
              type: array
              description: |
                Prämienarten, die die App auf dieser Plattform zeigt und einlöst. Standard iOS/Android:
                content, download (Rabatt auf die Verlängerung nur auf der Website, siehe docs/APP-STORE.md).
              items:
                type: string
                enum:
                - content
                - download
                - renewal_discount
            web_reading:
              type: boolean
              description: Lesepunkte auch für Artikel, die auf der Website gelesen werden
            app_streak:
              type: boolean
              description: Serie (Streak) fürs tägliche Öffnen; mehr Punkte pro Tag, je länger die Serie
        support_url:
          type: string
          format: uri
        privacy_url:
          type: string
          format: uri
    TokenResponse:
      type: object
      properties:
        access_token:
          type: string
        token_type:
          type: string
          example: Bearer
        expires_in:
          type: integer
          example: 3600
        refresh_token:
          type: string
        refresh_expires_in:
          type: integer
          example: 7776000
        user:
          $ref: '#/components/schemas/Me'
    Membership:
      type: object
      properties:
        plan:
          type: string
          example: komplett-paket
        name:
          type: string
          example: Komplett-Paket
        status:
          type: string
          example: active
        ends_at:
          type: string
          format: date-time
          nullable: true
    Onboarding:
      type: object
      properties:
        completed:
          type: boolean
        nutrition:
          type: object
          properties:
            diet:
              type: string
              enum:
              - alles
              - flexitarisch
              - vegetarisch
              - vegan
            meat_amount:
              type: string
              enum:
              - viel
              - wenig
              - keins
            intolerances:
              type: array
              items:
                type: string
                enum:
                - laktose
                - gluten
                - fruktose
                - histamin
                - nuesse
                - ei
                - soja
                - fisch
            dislikes:
              type: array
              items:
                type: string
              description: Freitext-Zutaten, z. B. "Koriander"
        activity_level:
          type: string
          enum:
          - sportmuffel
          - eingerostet
          - moderat_aktiv
          - sehr_aktiv
        social:
          type: object
          properties:
            gender:
              type: string
              enum:
              - weiblich
              - maennlich
              - divers
              - keine_angabe
            age_group:
              type: string
              enum:
              - u30
              - 30-39
              - 40-49
              - 50-59
              - 60plus
            household_size:
              type: integer
              minimum: 1
              maximum: 15
            children:
              type: integer
              minimum: 0
              maximum: 15
        communication:
          type: object
          properties:
            notifications_per_day:
              type: integer
              minimum: 0
              maximum: 10
            topics:
              type: array
              items:
                type: string
                enum:
                - rezepte
                - motivation
                - aufgaben
                - bewegung
                - wissen
            quiet_hours:
              type: object
              nullable: true
              description: Ruhezeit für Benachrichtigungen (Gerätezeit). Betrifft nur Benachrichtigungen, nicht die Coaching-Tage.
              properties:
                start:
                  type: string
                  pattern: ^([01][0-9]|2[0-3]):[0-5][0-9]$
                  example: '21:00'
                end:
                  type: string
                  pattern: ^([01][0-9]|2[0-3]):[0-5][0-9]$
                  example: '07:30'
    Goals:
      type: object
      properties:
        height_cm:
          type: number
          nullable: true
        start_weight_kg:
          type: number
          nullable: true
        target_weight_3m_kg:
          type: number
          nullable: true
        target_weight_6m_kg:
          type: number
          nullable: true
        target_weight_12m_kg:
          type: number
          nullable: true
        coaching_start_date:
          type: string
          format: date
          nullable: true
          description: Erster Umstellungstag (Phase 1 Tag 1)
    Me:
      type: object
      properties:
        id:
          type: integer
        email:
          type: string
        first_name:
          type: string
        display_name:
          type: string
        avatar_url:
          type: string
          format: uri
        memberships:
          type: array
          items:
            $ref: '#/components/schemas/Membership'
        has_coaching_access:
          type: boolean
        onboarding:
          $ref: '#/components/schemas/Onboarding'
        goals:
          $ref: '#/components/schemas/Goals'
        points_balance:
          type: integer
        referral_code:
          type: string
        updated_at:
          type: string
          format: date-time
    ProfileUpdate:
      type: object
      properties:
        first_name:
          type: string
        onboarding:
          $ref: '#/components/schemas/Onboarding'
        goals:
          $ref: '#/components/schemas/Goals'
    SyncItem:
      type: object
      description: |
        Schlüssel je Sammlung:
        - favorites: "recipe:<id>" oder "tip:<id>" · data {post_id, kind}
        - lessons_done: "<post_id>" · data {post_id}
        - courses_done: "<term_id>" · data {term_id}
        - weight: "YYYY-MM-DD" · data {date, kg}
        - sport: Client-UUID · data {date, activity, minutes, note?}
        - weekplan: "YYYY-MM-DD:<slot>" mit slot fruehstueck|mittag|abend|snack · data {date, slot, recipe_id?, note?, portions?} (keine Uhrzeiten).
          portions: ganze Zahl 1–12, sonst 400 invalid_weekplan. Ohne recipe_id und ohne note heißt der Platz "bewusst frei".
          Portionen und freie Plätze speichert nur das Plugin, nicht die MyVibono-Felder des Themes.
      properties:
        collection:
          type: string
          enum:
          - favorites
          - lessons_done
          - courses_done
          - weight
          - sport
          - weekplan
        key:
          type: string
        deleted:
          type: boolean
        data:
          type: object
          additionalProperties: true
        updated_at:
          type: string
          format: date-time
    ClientChange:
      allOf:
      - $ref: '#/components/schemas/CollectionChange'
      - type: object
        required:
        - collection
        properties:
          collection:
            type: string
            enum:
            - favorites
            - lessons_done
            - courses_done
            - weight
            - sport
            - weekplan
    CollectionChange:
      type: object
      required:
      - key
      - op
      - updated_at
      properties:
        client_change_id:
          type: string
          description: Frei wählbar, kommt im Ergebnis zurück
        key:
          type: string
        op:
          type: string
          enum:
          - upsert
          - delete
        data:
          type: object
          additionalProperties: true
        updated_at:
          type: string
          format: date-time
          description: Zeitpunkt der Änderung auf dem Gerät
    SyncPullResponse:
      type: object
      properties:
        cursor:
          type: string
        has_more:
          type: boolean
        full:
          type: boolean
          description: true, wenn ohne Cursor geladen wurde. Lokale Daten dieser Sammlungen ersetzen.
        changes:
          type: array
          items:
            $ref: '#/components/schemas/SyncItem'
    SyncPushResponse:
      type: object
      properties:
        cursor:
          type: string
        results:
          type: array
          items:
            type: object
            properties:
              client_change_id:
                type: string
              collection:
                type: string
              key:
                type: string
              status:
                type: string
                enum:
                - applied
                - stale
                - rejected
                description: stale = Server hat eine neuere Änderung, server_item ist maßgeblich
              error:
                type: string
                nullable: true
              server_item:
                $ref: '#/components/schemas/SyncItem'
    Phase:
      type: object
      properties:
        key:
          type: string
          enum:
          - vorbereitung
          - phase1
          - phase2
          - phase3
        label:
          type: string
          example: 'Phase 1: Umstellungstage'
        day_in_phase:
          type: integer
          example: 1
        day_label:
          type: string
          example: 1. Umstellungstag
        coaching_day:
          type: integer
          description: Fortlaufender Coaching-Tag ab Start, 0 = vor dem Start
    ContentSummary:
      type: object
      properties:
        id:
          type: integer
        type:
          type: string
          enum:
          - lesson
          - recipe
          - tip
          - tip_of_the_day
        title:
          type: string
        excerpt:
          type: string
        thumbnail_url:
          type: string
          format: uri
          nullable: true
        url:
          type: string
          format: uri
        tags:
          type: array
          items:
            type: string
        lesson_kind:
          type: string
          nullable: true
          description: 'Nur lessons: wichtig|lesen|aufgaben|motivation|rezepte|hinweise|probleme|freiwillig'
        course_id:
          type: integer
          nullable: true
        servings:
          type: integer
          nullable: true
          description: Nur Rezepte. Portionen, für die die Mengen in ingredients gelten. null = unbekannt.
        ingredients:
          type: array
          nullable: true
          description: |
            Nur Rezepte, nur wenn nicht gesperrt (locked = false). null = Zutaten konnten nicht gelesen werden,
            die App fällt dann auf "Zutaten für <Rezept>" zurück.
          items:
            $ref: '#/components/schemas/Ingredient'
        energy_density:
          type: number
          nullable: true
          description: kcal/g, nur Rezepte
        reading_minutes:
          type: integer
          nullable: true
        points_for_reading:
          type: integer
          description: 0 wenn schon belohnt oder nicht belohnbar
        requires_membership:
          type: boolean
        locked:
          type: boolean
          description: true wenn der Nutzer keinen Zugriff hat (Mitgliedschaft fehlt oder exklusiv und nicht freigeschaltet)
        exclusive:
          type: boolean
          description: Beitrag ist eine Prämie (nur gegen Punkte freischaltbar)
        reward:
          type: object
          nullable: true
          description: Nur exklusive Beiträge
          properties:
            id:
              type: integer
            cost_points:
              type: integer
            unlocked:
              type: boolean
        done:
          type: boolean
          nullable: true
          description: Nur lessons
        modified_at:
          type: string
          format: date-time
    Ingredient:
      type: object
      required:
      - name
      properties:
        name:
          type: string
          example: Magerquark
        amount:
          type: number
          nullable: true
          description: Menge für servings Portionen. Spannen wie "2-3" werden zum oberen Wert. null = nach Geschmack.
          example: 200
        unit:
          type: string
          nullable: true
          description: |
            Vereinheitlicht, kleingeschrieben: g, kg, ml, l, el, tl, stück, pck, prise, msp, bund, dose, becher, glas,
            scheibe, zehe, tasse, handvoll, kopf, stange, zweig. Unbekannte Einheiten kommen kleingeschrieben durch.
            null = Stückzahl ohne Einheit (z. B. "2 Zwiebeln").
          example: g
        group:
          type: string
          nullable: true
          description: Zwischenüberschrift im Rezept (z. B. "Für das Dressing"), kein Supermarkt-Regal
        kcal_per_100g:
          type: number
          nullable: true
          description: Optional, wird derzeit nicht geliefert
    PlannedMeal:
      type: object
      properties:
        slot:
          type: string
          enum:
          - fruehstueck
          - mittag
          - abend
          - snack
        recipe_id:
          type: integer
          nullable: true
          description: null = Notiz ohne Rezept oder Platz bewusst frei
        portions:
          type: integer
          nullable: true
        note:
          type: string
    ContentDetail:
      allOf:
      - $ref: '#/components/schemas/ContentSummary'
      - type: object
        properties:
          content_html:
            type: string
            description: |
              Bei Rezepten mit ingredients ohne den Zutatenblock (Zutatenbereich von WP Recipe Maker oder Überschrift
              "Zutaten …" mit den folgenden Listen), damit die Zutaten nicht doppelt erscheinen.
          ingredients_stripped:
            type: boolean
            description: true, wenn ein Zutatenblock aus content_html entfernt wurde. false bei allen anderen Inhalten.
          word_count:
            type: integer
    CoachingDay:
      type: object
      properties:
        date:
          type: string
          format: date
        phase:
          $ref: '#/components/schemas/Phase'
        progress:
          type: object
          properties:
            overall:
              type: number
              minimum: 0
              maximum: 1
              description: Anteil bis zum 12-Monats-Ziel
            phase:
              type: number
              minimum: 0
              maximum: 1
            milestones:
              type: array
              items:
                type: object
                properties:
                  key:
                    type: string
                    enum:
                    - m3
                    - m6
                    - m12
                  date:
                    type: string
                    format: date
                  target_weight_kg:
                    type: number
                    nullable: true
                  reached:
                    type: boolean
        next_step:
          $ref: '#/components/schemas/ContentSummary'
        sections:
          type: object
          description: Inhalte des Tages ohne Uhrzeiten
          properties:
            essen:
              type: array
              items:
                $ref: '#/components/schemas/ContentSummary'
            bewegung:
              type: array
              items:
                $ref: '#/components/schemas/ContentSummary'
            wissen:
              type: array
              items:
                $ref: '#/components/schemas/ContentSummary'
            sonstiges:
              type: array
              items:
                $ref: '#/components/schemas/ContentSummary'
        recipes:
          type: array
          description: |
            recipes_source = weekplan: die Rezepte aus dem Wochenplan dieses Tages in der Reihenfolge der Mahlzeiten,
            ohne doppelte Rezepte und ohne freie Plätze (kann leer sein). recipes_source = suggestion: bis zu 3 Vorschläge.
          items:
            $ref: '#/components/schemas/ContentSummary'
        recipes_source:
          type: string
          enum:
          - weekplan
          - suggestion
        planned_meals:
          type: array
          description: Wochenplan-Einträge des Tages (leer = nichts geplant), Reihenfolge fruehstueck, mittag, abend, snack
          items:
            $ref: '#/components/schemas/PlannedMeal'
        vibono_tip:
          $ref: '#/components/schemas/ContentSummary'
        tip_of_the_day:
          type: object
          properties:
            id:
              type: integer
              nullable: true
            text:
              type: string
        points:
          type: object
          properties:
            balance:
              type: integer
            app_open_awarded_today:
              type: boolean
            streak:
              $ref: '#/components/schemas/Streak'
    PointsSummary:
      type: object
      properties:
        balance:
          type: integer
          description: Bestätigte Punkte
        pending:
          type: integer
          description: Vorgemerkte Punkte (z. B. Kauf vor Ablauf der Widerrufsfrist)
        cents_per_point:
          type: number
          description: Grundkurs, Start 1
        effective_cents_per_point:
          type: number
          description: Kurs inkl. laufender Einlöse-Aktion
        value_cents:
          type: integer
          description: balance × effective_cents_per_point
        earn_rules:
          type: object
          description: |
            Aktuelle Punkte je Aktion (inkl. Multiplikator laufender Aktionen). Schlüssel: app_open, article_read,
            lesson_done, course_done, referral (nur mit Modul „Freunde werben“), purchase (nur wenn Punkte für
            Einkäufe an sind). Abgeschaltete Aktionen (0 Punkte) fehlen.
          additionalProperties:
            type: integer
        campaigns:
          type: array
          items:
            $ref: '#/components/schemas/Campaign'
        streak:
          $ref: '#/components/schemas/Streak'
    Streak:
      type: object
      description: |
        Serie fürs tägliche Öffnen der App. Je mehr Tage in Folge, desto mehr Punkte pro Tag (Stufen im Backend
        einstellbar). Verpasste Tage überbrücken Schutztage (grace_per_month je Kalendermonat); reicht das nicht,
        greift on_break. Eine laufende Aktion für app_open multipliziert die Punkte der Stufe.
        Bei enabled = false fehlen alle anderen Felder.
      required:
      - enabled
      properties:
        enabled:
          type: boolean
        days:
          type: integer
          description: Tage in Folge (inkl. heute, wenn heute geöffnet). 0 = keine laufende Serie.
          example: 7
        best:
          type: integer
          description: Längste Serie bisher
        opened_today:
          type: boolean
        alive:
          type: boolean
          description: false = Serie ist gerissen; beim nächsten Öffnen greift on_break
        today:
          type: object
          description: Tag und Punkte für heute (nach dem Öffnen bzw. falls heute geöffnet würde), ohne Aktion
          properties:
            day:
              type: integer
            points:
              type: integer
        stage:
          $ref: '#/components/schemas/StreakLevel'
        next_stage:
          type: object
          nullable: true
          description: null = höchste Stufe erreicht
          properties:
            from_day:
              type: integer
            points:
              type: integer
            days_left:
              type: integer
        levels:
          type: array
          description: Alle Stufen, aufsteigend; die erste gilt ab Tag 1
          items:
            $ref: '#/components/schemas/StreakLevel'
        grace_per_month:
          type: integer
        grace_left:
          type: integer
          description: Übrige Schutztage im laufenden Monat
        on_break:
          type: string
          enum:
          - drop_level
          - reset
          description: drop_level = eine Stufe zurück, reset = neu bei Tag 1
        event:
          type: string
          description: Nur in der Antwort auf POST /points/app-open
          enum:
          - first
          - continued
          - bridged
          - broken
          - same_day
        bridged_days:
          type: integer
          description: Nur bei event = bridged; so viele Schutztage wurden heute verbraucht
        previous_days:
          type: integer
          description: Serie vor dem heutigen Öffnen
    StreakLevel:
      type: object
      properties:
        from_day:
          type: integer
          example: 7
        points:
          type: integer
          example: 8
    Campaign:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
          example: Freunde-Wochen
        description:
          type: string
        kind:
          type: string
          enum:
          - earn
          - redeem
        reasons:
          type: array
          description: Nur kind=earn, für welche Aktionen der Multiplikator gilt (leer = alle)
          items:
            type: string
