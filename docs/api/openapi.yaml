        share_text:
          type: string
        invited:
          type: integer
          description: Registrierte Freunde
        converted:
          type: integer
          description: Freunde mit erster bezahlter Bestellung
        points_earned:
          type: integer
        points_per_referral:
          type: integer
          description: Inkl. laufender Aktion
        friend_bonus_points:
          type: integer
    Food:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        kcal_per_100g:
          type: number
        source:
          type: string
