; PHP-Einstellungen der Vibono-Testumgebung (Windows).
; extension_dir und curl.cainfo setzt Start.bat mit vollständigem Pfad.

extension=curl
extension=fileinfo
extension=gd
extension=intl
extension=mbstring
extension=openssl
extension=pdo_sqlite
extension=sqlite3
extension=sodium
extension=zip
extension=exif
zend_extension=opcache

opcache.enable=1
opcache.enable_cli=1
opcache.memory_consumption=128
opcache.max_accelerated_files=20000
opcache.validate_timestamps=1
opcache.revalidate_freq=2

memory_limit=512M
max_execution_time=120
max_input_time=120
upload_max_filesize=20M
post_max_size=25M
date.timezone=Europe/Berlin
default_charset="UTF-8"
display_errors=Off
log_errors=On
error_reporting=E_ALL & ~E_DEPRECATED & ~E_STRICT
